# docker-compose.yml
# Configuración para BionicHand - Soporte multiplataforma

version: '3.8'

services:
  bionic_hand:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bionic_hand_sim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # Windows: Usa VcXsrv X server en host.docker.internal:0.0
      - DISPLAY=host.docker.internal:0.0
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    # Para conexión a red de Docker
    network_mode: bridge